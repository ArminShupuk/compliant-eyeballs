name: connection-profile
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test:public-tree
      - run: npm run test:classifications
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-coverage
          path: docs/coverage-results.json
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20.0.0', '20.18.1', '22.0.0', '22.12.0', '22.19.0', '24.15.0', '24.17.0', '24.18.0', '24.19.0', '24.21.0', '26.9.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Newer Undici versions are dev-only matrix fixtures. The runner excludes
      # them when their own engines requirement exceeds the active Node version.
      - run: npm ci --ignore-scripts
      - run: npm run test:platform
        env:
          EYEBALLS_PLATFORM_DIR: ${{ runner.temp }}/eyeballs-platform
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.os }}-${{ matrix.node }}
          path: ${{ runner.temp }}/eyeballs-platform
  native-architectures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15-intel, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:platform
        env:
          EYEBALLS_PLATFORM_DIR: ${{ runner.temp }}/eyeballs-platform
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.os }}-24.21.0
          path: ${{ runner.temp }}/eyeballs-platform
  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, case: node20-debian, platform: linux/amd64 }
          - { runner: ubuntu-24.04, case: node22-debian, platform: linux/amd64 }
          - { runner: ubuntu-24.04, case: node24-debian, platform: linux/amd64 }
          - { runner: ubuntu-24.04, case: node24-alpine, platform: linux/amd64 }
          - { runner: ubuntu-24.04, case: node26-debian, platform: linux/amd64 }
          - { runner: ubuntu-24.04, case: node26-alpine, platform: linux/amd64 }
          - { runner: ubuntu-24.04-arm, case: node24-debian, platform: linux/arm64 }
          - { runner: ubuntu-24.04-arm, case: node24-alpine, platform: linux/arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: npm run test:docker -- --case=${{ matrix.case }} --platform=${{ matrix.platform }} --output=${{ runner.temp }}/eyeballs-docker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-${{ matrix.case }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/eyeballs-docker
  undici-minors:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test:undici-minors
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: undici-minors-${{ matrix.os }}
          path: docs/undici-minor-results.json
  electron:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        electron: ['41.10.7', '42.3.0', '42.5.0', '44.1.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts
      - run: npm install --no-save electron@${{ matrix.electron }}
      # Electron 42+ exposes installation as an explicit command.
      - run: node node_modules/electron/install.js
      - run: npm run build
      - run: npm run test:electron
